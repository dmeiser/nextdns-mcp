name: Revert Watchdog

# Backstop for a bad merge: when the post-merge validation of a main-branch
# push fails (E2E Container with live writes, or Unit Tests), open an automatic
# revert PR of the offending commit so the merge is effectively cancelled
# without waiting for a human. The release pipeline stays quiet because a
# failed E2E also blocks Auto Release.
#
# Validation without breaking main: dispatch this workflow against a
# known-good SHA, e.g.
#   gh workflow run revert-watchdog.yml -f sha=<full-sha-on-main>
# It runs the identical flow, pushing an auto-revert/<sha> branch and opening
# a revert PR. Close the PR and delete the branch when the check is done.

on:
  workflow_run:
    workflows: ["E2E Container", "Unit Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full SHA on main to revert (manual validation of this workflow)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  revert:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The git commands below need a real repository with full history:
          # `git revert` must see the failing commit and its parent. Without
          # this step the workspace is empty and the job aborts at
          # "fatal: not in a git directory" (exit 128).
          fetch-depth: 0

      - name: Create revert PR for the failing head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/workflows/revert-watchdog.yml', github.server_url, github.repository) }}
          RUN_NAME: ${{ github.event.workflow_run.name || 'manual dispatch' }}
        run: |
          set -euo pipefail

          if [ -z "$HEAD_SHA" ]; then
            echo "HEAD_SHA is empty; pass a sha input when dispatching manually." >&2
            exit 1
          fi

          # workflow_dispatch takes arbitrary input; HEAD_SHA flows into branch
          # names, git commands, and PR bodies, so require a full 40-hex SHA
          # before it is used anywhere.
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "HEAD_SHA must be a full 40-character hex SHA; got '$HEAD_SHA'." >&2
            exit 1
          fi

          existing=$(gh pr list --repo "$REPO" --state open --search "$HEAD_SHA" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "A revert PR for $HEAD_SHA is already open; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # Refuse to revert anything that is not on main: a SHA outside
          # origin/main's history (a forked commit, a different repo, a
          # mistyped dispatch input) must not drive git revert or PR creation.
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "HEAD_SHA $HEAD_SHA is not an ancestor of origin/main; refusing to revert." >&2
            exit 1
          fi

          branch="auto-revert/${HEAD_SHA:0:8}"
          git checkout -b "$branch" origin/main

          # Squash-merged PRs land as single-parent commits; true merge
          # commits need the mainline flag. Handle both.
          if [ "$(git rev-list --parents -n1 "$HEAD_SHA" | wc -w)" -gt 2 ]; then
            git revert --no-edit -m 1 "$HEAD_SHA"
          else
            git revert --no-edit "$HEAD_SHA"
          fi

          git push origin "$branch"

          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "auto-revert: ${HEAD_SHA:0:8} (post-merge $RUN_NAME failure)" \
            --body "Automatic revert proposed because the post-merge **$RUN_NAME** run failed for this push.

          Failing run: $RUN_URL
          Commit: $REPO@$HEAD_SHA

          Merging this PR restores main to the last validated state. Add a \`bump-*\` label if the revert should also be released."
