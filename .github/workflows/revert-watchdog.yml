name: Revert Watchdog

# Backstop for a bad merge: when the post-merge validation of a main-branch
# push fails (E2E Container with live writes, or Unit Tests), open an automatic
# revert PR of the offending commit so the merge is effectively cancelled
# without waiting for a human. The release pipeline stays quiet because a
# failed E2E also blocks Auto Release.

on:
  workflow_run:
    workflows: ["E2E Container", "Unit Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  revert:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Create revert PR for the failing head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --repo "$REPO" --state open --search "$HEAD_SHA" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "A revert PR for $HEAD_SHA is already open; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          branch="auto-revert/${HEAD_SHA:0:8}"
          git checkout -b "$branch" origin/main

          # Squash-merged PRs land as single-parent commits; true merge
          # commits need the mainline flag. Handle both.
          if [ "$(git rev-list --parents -n1 "$HEAD_SHA" | wc -w)" -gt 2 ]; then
            git revert --no-edit -m 1 "$HEAD_SHA"
          else
            git revert --no-edit "$HEAD_SHA"
          fi

          git push origin "$branch"

          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "auto-revert: ${HEAD_SHA:0:8} (post-merge $RUN_NAME failure)" \
            --body "Automatic revert proposed because the post-merge **$RUN_NAME** run failed for this push.

          Failing run: $RUN_URL
          Commit: $REPO@$HEAD_SHA

          Merging this PR restores main to the last validated state. Add a \`bump-*\` label if the revert should also be released."
