name: Build and Push Docker Image

on:
  # Trigger after Unit Tests completes on main. The docker-publish job's
  # condition re-verifies the run passed, so no in-step polling is needed.
  workflow_run:
    workflows: ["Unit Tests"]
    types:
      - completed
    branches:
      - main

  # Version tags are published by the workflow_run path above (when a commit lands on
  # main), so there is no separate tag-push trigger. That avoids a race where a tag
  # created by auto-release could be processed before the short-SHA image was pushed.

  # Allow manual rebuild
  workflow_dispatch:

  # Nightly build for base image security updates
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  packages: write  # Required to push to ghcr.io

# Prevent duplicate runs for the same commit
concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Run Quality Checks
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/unit-tests.yml

  # For workflow_run events, decide whether the merged commit came from a
  # release PR. A PR merged with the `no-release` label publishes no tags:
  # the docker-publish job below is skipped entirely.
  gate:
    name: Determine release status
    # Only a push from this repository can produce a release merge. Unit Tests
    # also runs on pull_request, so a fork PR (even from a branch named main)
    # completes a workflow_run; without these guards the gate would run
    # against untrusted fork code with registry-push credentials downstream.
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
    steps:
      - name: Determine release status
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha
            });

            // Identify the PR that was merged via this commit and check for the no-release label.
            const mergedPr = prs.find(pr => pr.state === 'closed' && pr.merged_at && pr.merge_commit_sha === headSha);
            const isNoRelease = mergedPr && mergedPr.labels.some(label => label.name === 'no-release');
            // Fail closed: without a merged PR this is not a release merge, so
            // an absent mergedPr must not enable release publishing.
            const isRelease = Boolean(mergedPr) && !isNoRelease;

            console.log(`Head SHA: ${headSha}`);
            console.log(`Merged PR: ${mergedPr ? `#${mergedPr.number}` : 'none'}`);
            console.log(`Is no-release: ${isNoRelease}`);
            console.log(`Is release merge: ${isRelease}`);
            core.setOutput('is_release', isRelease.toString());

  docker-publish:
    name: Build and Push Docker Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, alpine]
    needs: [quality, gate]
    if: |
      always() &&
      !contains(github.event.workflow_run.head_commit.message || '', '[skip-docker]') &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main' &&
          needs.gate.outputs.is_release == 'true'
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
          needs.quality.result == 'success'
        )
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For workflow_run events, checkout the commit that triggered the workflow
          # For schedule events, checkout main (stable release code)
          ref: ${{ github.event.workflow_run.head_sha || (github.event_name == 'schedule' && 'main') || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract project version
        id: version
        run: |
          VERSION=$(python3 - << 'PY'
          import pathlib
          import sys
          import tomllib

          path = pathlib.Path("pyproject.toml")
          if not path.is_file():
              print("Error: pyproject.toml not found", file=sys.stderr)
              raise SystemExit(1)

          with path.open("rb") as f:
              data = tomllib.load(f)

          try:
              version = data["project"]["version"]
          except KeyError:
              print("Error: 'project.version' not found in pyproject.toml", file=sys.stderr)
              raise SystemExit(1)

          if not isinstance(version, str) or not version.strip():
              print("Error: 'project.version' is empty or not a string", file=sys.stderr)
              raise SystemExit(1)

          print(version.strip())
          PY
          )
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from pyproject.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker (${{ matrix.variant }})
        id: meta
        env:
          # One metadata configuration serves both variants (issue #804); the
          # variant's tag names and suffix are the only differences. slim
          # publishes latest/nightly and unsuffixed tags, alpine publishes
          # alpine/nightly-alpine and -alpine-suffixed tags.
          FLOATING_TAG: ${{ matrix.variant == 'alpine' && 'alpine' || 'latest' }}
          NIGHTLY_TAG: ${{ matrix.variant == 'alpine' && 'nightly-alpine' || 'nightly' }}
          TAG_SUFFIX: ${{ matrix.variant == 'alpine' && '-alpine' || '' }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nextdns-mcp
            ghcr.io/${{ github.repository }}
          tags: |
            # Floating tag for release merges on main, scheduled, and manual rebuilds.
            # A no-release merge publishes no tags at all.
            type=raw,value=${{ env.FLOATING_TAG }},enable=${{ (github.event_name == 'workflow_run' && needs.gate.outputs.is_release == 'true') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            # Nightly tag for scheduled base-image rebuilds
            type=raw,value=${{ env.NIGHTLY_TAG }},enable=${{ github.event_name == 'schedule' }}
            # Commit SHA tag used to identify the tested image
            type=raw,value=${{ steps.sha.outputs.short }}${{ env.TAG_SUFFIX }},enable=${{ (github.event_name == 'workflow_run' && needs.gate.outputs.is_release == 'true') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            # Immutable version tags are only published for release merges on main
            # and manual rebuilds from refs/heads/main
            type=raw,value=${{ steps.version.outputs.version }}${{ env.TAG_SUFFIX }},enable=${{ (github.event_name == 'workflow_run' && needs.gate.outputs.is_release == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
            type=raw,value=${{ steps.version.outputs.major }}${{ env.TAG_SUFFIX }},enable=${{ (github.event_name == 'workflow_run' && needs.gate.outputs.is_release == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
            type=raw,value=${{ steps.version.outputs.major_minor }}${{ env.TAG_SUFFIX }},enable=${{ (github.event_name == 'workflow_run' && needs.gate.outputs.is_release == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

      - name: Build and push Docker image (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile${{ matrix.variant == 'alpine' && '.alpine' || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

      - name: Determine published platforms
        if: always()
        id: platforms
        run: |
          echo "list=linux/amd64, linux/arm64" >> "$GITHUB_OUTPUT"

      - name: Generate image summary (${{ matrix.variant }})
        if: always()
        run: |
          {
            echo "## 🚀 Docker Images Published — ${{ matrix.variant }}"
            echo ""
            echo "### Docker Hub"
            echo "**Registry:** docker.io/${{ secrets.DOCKERHUB_USERNAME }}/nextdns-mcp"
            echo '```bash'
            if [ "${{ matrix.variant }}" = "alpine" ]; then
              echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nextdns-mcp:alpine"
            else
              echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nextdns-mcp:latest"
            fi
            echo '```'
            echo ""
            echo "### GitHub Container Registry"
            echo "**Registry:** ghcr.io/${{ github.repository }}"
            echo '```bash'
            if [ "${{ matrix.variant }}" = "alpine" ]; then
              echo "docker pull ghcr.io/${{ github.repository }}:alpine"
            else
              echo "docker pull ghcr.io/${{ github.repository }}:latest"
            fi
            echo '```'
            echo ""
            echo "**Tags Applied:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Platforms:** ${{ steps.platforms.outputs.list }}"
          } >> "$GITHUB_STEP_SUMMARY"
