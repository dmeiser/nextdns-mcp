name: E2E MCP Gateway

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      allow_live_writes:
        description: 'Enable write operations (creates/deletes test profiles). Maintainer opt-in only.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: 
      - main
    tags:
      - 'v*.*.*'  # Also run on version tags
  pull_request:
    branches: [ main ]  # Run on all PRs to main

permissions:
  contents: read

jobs:
  # Security gate for pull_request events (issue #137). PRs cannot see repo
  # secrets and PR-controlled code must never execute against a live account,
  # so the gateway E2E job below is excluded for pull_request. Instead, PRs run
  # this static assertion of the E2E workflow's security invariants, which keeps
  # PR CI green without materializing NEXTDNS_API_KEY or exercising live writes.
  # (The unit test suite is covered separately by unit-tests.yml on pull_request.)
  pr-security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Assert E2E workflow security invariants
        run: uv run --no-project --with pyyaml python3 scripts/assert_workflow_security.py .github/workflows/e2e-mcp-gateway.yml

  e2e:
    # Live writes and secret access are restricted to maintainer/non-PR events
    # (workflow_dispatch/schedule), push, and the release workflow_call
    # (issue #137). pull_request runs are handled by the pr-security job above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, alpine]
    env:
      # Security (issue #137): live writes are opt-in and restricted to
      # maintainer-initiated events. pull_request always resolves 'false' and
      # the dispatch input is only consulted on workflow_dispatch, so a PR can
      # never opt in. push/tag/schedule/workflow_call keep the original
      # release-path default of 'true' (the release pipeline relies on it),
      # and workflow_dispatch is 'true' only when a maintainer explicitly
      # selects it (the input defaults to 'false').
      ALLOW_LIVE_WRITES: ${{ github.event_name == 'pull_request' && 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.allow_live_writes == 'true' && 'true' || 'false') || 'true') }}
      # Gate secret injection to non-PR events: on pull_request the API key
      # and profile secret resolve empty, so PR-controlled checkout contents
      # never see the repo secret (issue #137).
      NEXTDNS_READABLE_PROFILES: ${{ github.event_name == 'pull_request' && '' || 'ALL' }}
      NEXTDNS_WRITABLE_PROFILES: ${{ github.event_name == 'pull_request' && '' || 'ALL' }}
      CI: 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Create Docker CLI plugin directory
        run: |
          mkdir -p $HOME/.docker/cli-plugins

      - name: Install Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14' 

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: "true"

      # Fail fast (before any secret-bearing step) if the workflow drifts back
      # into allowing live writes or secret injection on pull_request.
      - name: Assert E2E workflow security invariants
        run: uv run --no-project --with pyyaml python3 scripts/assert_workflow_security.py .github/workflows/e2e-mcp-gateway.yml

      - name: Build docker-mcp plugin from source
        run: |
          # Clone the MCP Gateway repo at latest HEAD
          git clone --depth 1 https://github.com/docker/mcp-gateway.git /tmp/mcp-gateway
          cd /tmp/mcp-gateway
          
          # Build the plugin
          make docker-mcp
          
          # Install to CLI plugins directory
          mkdir -p $HOME/.docker/cli-plugins
          cp ./dist/docker-mcp $HOME/.docker/cli-plugins/docker-mcp
          chmod +x $HOME/.docker/cli-plugins/docker-mcp

      - name: Verify docker-mcp installation
        run: |
          docker mcp --help
          docker mcp version

      - name: Verify Docker daemon
        run: |
          docker info
          docker ps

      - name: Build NextDNS MCP Docker image (${{ matrix.variant }})
        run: |
          if [ "${{ matrix.variant }}" = "alpine" ]; then
            docker build -f Dockerfile.alpine -t nextdns-mcp:alpine .
          else
            docker build -f Dockerfile -t nextdns-mcp:slim .
          fi

      # Persist the image so the release pipeline can publish it without rebuilding.
      # E2E builds a single-platform (linux/amd64) image for local testing.
      - name: Save Docker image (${{ matrix.variant }}) for release reuse
        run: |
          docker save -o /tmp/nextdns-mcp-${{ matrix.variant }}.tar nextdns-mcp:${{ matrix.variant }}

      - name: Upload Docker image artifact (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/nextdns-mcp-${{ matrix.variant }}.tar
          retention-days: 7
          if-no-files-found: error

      - name: Create .env file for script
        env:
          # Defense in depth: the job-level `if` above already excludes
          # pull_request, and the job env pins these to '' for pull_request,
          # so the repo secret is never materialized on PR runs even if the
          # job-level guard were ever weakened (issue #137).
          NEXTDNS_API_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.NEXTDNS_API_KEY }}
          NEXTDNS_PLOT_PROFILE: ${{ github.event_name == 'pull_request' && '' || secrets.NEXTDNS_PLOT_PROFILE }}
        run: |
          cat > .env <<EOF
          NEXTDNS_API_KEY=${NEXTDNS_API_KEY}
          ALLOW_LIVE_WRITES=${ALLOW_LIVE_WRITES}
          NEXTDNS_READABLE_PROFILES=${NEXTDNS_READABLE_PROFILES}
          NEXTDNS_WRITABLE_PROFILES=${NEXTDNS_WRITABLE_PROFILES}
          NEXTDNS_PLOT_PROFILE=${NEXTDNS_PLOT_PROFILE}
          EOF
          
          # Create secrets file for docker-mcp (file-based secrets instead of Desktop API)
          mkdir -p ~/.docker/mcp
          echo "nextdns.api_key=${NEXTDNS_API_KEY}" > ~/.docker/mcp/secrets.env
          echo "Secrets file created with nextdns.api_key"

      - name: Run E2E validation script (${{ matrix.variant }})
        run: |
          chmod +x scripts/gateway_e2e_run.sh
          scripts/gateway_e2e_run.sh .env ${{ matrix.variant }}

      - name: Upload test report (${{ matrix.variant }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report-${{ matrix.variant }}
          path: artifacts/tools_report_${{ matrix.variant }}.jsonl
          if-no-files-found: warn

      - name: Display test summary (${{ matrix.variant }})
        if: always()
        env:
          REPORT_FILE: artifacts/tools_report_${{ matrix.variant }}.jsonl
        run: |
          echo "## E2E Test Results — ${{ matrix.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "$REPORT_FILE" ]; then
            TOTAL=$(wc -l < "$REPORT_FILE")
            PASSED=$(grep -c '"status":"OK"' "$REPORT_FILE" || echo "0")
            FAILED=$(grep -c '"status":"FAILED"' "$REPORT_FILE" || echo "0")
            SKIPPED=$(grep -c '"status":"SKIPPED"' "$REPORT_FILE" || echo "0")
            SCHEMA_VALID=$(grep -c '"schema_validation":"VALID"' "$REPORT_FILE" || echo "0")
            SCHEMA_INVALID=$(grep -c '"schema_validation":"INVALID"' "$REPORT_FILE" || echo "0")
            SCHEMA_SKIPPED=$(grep -c '"schema_validation":"SKIPPED"' "$REPORT_FILE" || echo "0")
            
            echo "- **Total Tools**: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Passed**: ✅ $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed**: ❌ $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- **Skipped**: ⏭️ $SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Schema Validation" >> $GITHUB_STEP_SUMMARY
            echo "- **Valid**: ✅ $SCHEMA_VALID" >> $GITHUB_STEP_SUMMARY
            echo "- **Invalid**: ❌ $SCHEMA_INVALID" >> $GITHUB_STEP_SUMMARY
            echo "- **Skipped**: ⏭️ $SCHEMA_SKIPPED" >> $GITHUB_STEP_SUMMARY
            
            if [ $FAILED -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed Tools" >> $GITHUB_STEP_SUMMARY
              grep '"status":"FAILED"' "$REPORT_FILE" | jq -r '"\(.tool): \(.error // "Unknown error")"' >> $GITHUB_STEP_SUMMARY || echo "Could not parse failures" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ $SCHEMA_INVALID -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Schema Validation Failures" >> $GITHUB_STEP_SUMMARY
              grep '"schema_validation":"INVALID"' "$REPORT_FILE" | jq -r '"\(.tool): \(.schema_error)"' >> $GITHUB_STEP_SUMMARY || echo "Could not parse schema errors" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ No test report generated ($REPORT_FILE)" >> $GITHUB_STEP_SUMMARY
          fi
