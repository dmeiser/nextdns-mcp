name: Unit Tests

on:
  workflow_call:
    outputs:
      coverage:
        description: "Overall coverage percentage (statements and branches)"
        value: ${{ jobs.unit-tests.outputs.coverage }}
      failed_files:
        description: "List of files below threshold"
        value: ${{ jobs.unit-tests.outputs.failed_files }}
  push:
    branches: 
      - main
    tags:
      - 'v*.*.*'  # Also run on version tags
  pull_request:
    branches: [ main ]  # Run on all PRs to main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run mypy
        run: uv run mypy src

  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run ruff check
        run: uv run ruff check src tests

      - name: Run ruff format check
        run: uv run ruff format --check src tests

  complexity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run radon complexity check
        run: |
          # Project average complexity must stay at Grade A.
          AVERAGE=$(uv run radon cc src/ scripts/run_container_e2e.py -a --total-average | tail -1 | awk '{print $3}')
          if [ "$AVERAGE" != "A" ]; then
            echo "Project average complexity is grade $AVERAGE, Grade A required."
            exit 1
          fi
          # No individual function may exceed Grade B.
          OUTPUT=$(uv run radon cc src/ scripts/run_container_e2e.py -nc)
          if [ -n "$OUTPUT" ]; then
            echo "Radon found functions exceeding Grade B:"
            echo "$OUTPUT"
            exit 1
          fi

  unit-tests:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
      failed_files: ${{ steps.tests.outputs.failed_files }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run unit tests with coverage
        id: tests
        run: |
          # Run tests and capture output
          uv run pytest tests/unit --cov=src/nextdns_mcp --cov-report=term-missing > test_output.txt 2>&1 || TEST_EXIT_CODE=$?
          
          # Display output
          cat test_output.txt
          
          # Check if tests passed (exit code 0)
          if [ "${TEST_EXIT_CODE:-0}" -ne 0 ]; then
            echo "❌ Tests failed with exit code: ${TEST_EXIT_CODE:-0}"
            exit 1
          fi
          
          # Branch coverage is part of the 100% target, not just statements
          # (issue #278). A statement-only report cannot see an untested
          # branch, so require the branch columns `term-missing` only emits
          # when [tool.coverage.run] branch = true is set in pyproject.toml.
          if ! grep -q "^Name.*Branch" test_output.txt; then
            echo "❌ Coverage report has no branch columns: set [tool.coverage.run] branch = true in pyproject.toml"
            exit 1
          fi

          # With the branch columns present the row layout is
          #   Name Stmts Miss Branch BrPart Cover [Missing]
          # so Miss is field 3, BrPart field 5 and Cover field 6. The 100%
          # contract is judged on the exact Miss/BrPart counts, because Cover
          # is rounded to whole percent and still reads 100% while a few
          # branches go untaken (issue #278).
          TOTAL_ROW=$(grep "^TOTAL" test_output.txt || true)
          COVERAGE=$(echo "$TOTAL_ROW" | awk '{print $6}' | sed 's/%//')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Overall Coverage: $COVERAGE%"

          # Check if overall coverage is 100%
          if [ -z "$COVERAGE" ]; then
            echo "❌ Could not extract coverage percentage"
            exit 1
          fi

          TOTAL_MISS=$(echo "$TOTAL_ROW" | awk '{print $3}')
          TOTAL_BRPART=$(echo "$TOTAL_ROW" | awk '{print $5}')
          if [ "$TOTAL_MISS" != "0" ] || [ "$TOTAL_BRPART" != "0" ]; then
            echo "❌ Overall coverage $COVERAGE% is below 100%: $TOTAL_MISS missed statement(s), $TOTAL_BRPART untaken branch(es)"
            exit 1
          fi

          echo "✅ Overall coverage: $COVERAGE% (100% of statements and branches required)"

          # Check per-file coverage (no file below 100%)
          echo "Checking per-file coverage..."
          MIN_FILE_COVERAGE=100
          FAILED_FILES=""
          
          while IFS= read -r line; do
            # Skip header and separator lines
            if echo "$line" | grep -q "^-\|^Name\|^TOTAL"; then
              continue
            fi
            
            # Extract filename, coverage percentage and the exact miss counts
            FILENAME=$(echo "$line" | awk '{print $1}')
            FILE_COVERAGE=$(echo "$line" | awk '{print $6}')
            FILE_MISS=$(echo "$line" | awk '{print $3}')
            FILE_BRPART=$(echo "$line" | awk '{print $5}')

            # Skip if not a coverage row (the 6th field is the Cover column)
            if ! [[ "$FILE_COVERAGE" =~ ^[0-9]+%$ ]]; then
              continue
            fi
            FILE_COVERAGE=${FILE_COVERAGE%\%}

            # Check if the file misses any statement or branch
            if [ "$FILE_MISS" != "0" ] || [ "$FILE_BRPART" != "0" ]; then
              echo "❌ File $FILENAME has coverage $FILE_COVERAGE% ($FILE_MISS missed statement(s), $FILE_BRPART untaken branch(es), below $MIN_FILE_COVERAGE% threshold)"
              FAILED_FILES="${FAILED_FILES}\n- $FILENAME: $FILE_COVERAGE%"
            else
              echo "✅ File $FILENAME: $FILE_COVERAGE%"
            fi
          done < test_output.txt
          
          # Fail if any files below threshold
          if [ -n "$FAILED_FILES" ]; then
            echo ""
            echo "❌ The following files have coverage below $MIN_FILE_COVERAGE%:"
            echo -e "$FAILED_FILES"
            echo "failed_files=$FAILED_FILES" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo ""
          echo "✅ All files have $MIN_FILE_COVERAGE% statement and branch coverage"
          echo "✅ All unit tests passed!"

      - name: Generate coverage report
        if: always()
        run: |
          uv run pytest tests/unit --cov=src/nextdns_mcp --cov-report=html --cov-report=json --no-cov-on-fail 2>/dev/null || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.json
          if-no-files-found: warn

      - name: Display test summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f test_output.txt ]; then
            TOTAL_TESTS=$(grep -E "^[0-9]+ passed" test_output.txt | awk '{print $1}' || echo "0")
            COVERAGE="${{ steps.tests.outputs.coverage }}"
            
            echo "- **Tests**: ✅ $TOTAL_TESTS passed" >> $GITHUB_STEP_SUMMARY
            echo "- **Overall Coverage**: $COVERAGE% (100% of statements and branches required)" >> $GITHUB_STEP_SUMMARY
            echo "- **Per-File Coverage**: All files 100% statement and branch coverage" >> $GITHUB_STEP_SUMMARY
            
            if [ -n "${{ steps.tests.outputs.failed_files }}" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Files Below Coverage Threshold" >> $GITHUB_STEP_SUMMARY
              echo "${{ steps.tests.outputs.failed_files }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ No test output generated" >> $GITHUB_STEP_SUMMARY
          fi
