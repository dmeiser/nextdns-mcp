name: Version Bumper (Auto-Sync)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  bump-version:
    # Only run on specific bump labels and avoid forks or already closed PRs
    if: |
      (github.event.label.name == 'bump-patch' || 
       github.event.label.name == 'bump-minor' || 
       github.event.label.name == 'bump-major') &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.head.repo.fork &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Checkout Main (Baseline)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-ref

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15

      - name: Calculate and Update Version
        id: update_version
        env:
          BUMP_LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          # Run the baseline's copy: post-merge main always has the CLI while
          # stale PR branches may not, and the PR must not supply code that
          # runs with a contents: write token. Still bump from main's version,
          # not the PR head's, so a stale branch cannot re-apply a release.
          NEXT_V=$(python3 main-ref/scripts/version_sync.py bump --root . --label "$BUMP_LABEL" --baseline main-ref)
          echo "next_version=$NEXT_V" >> "$GITHUB_OUTPUT"

      # uv.lock pins this package's own version, so it must be re-locked after
      # the version edits or `uv lock --check` fails in every unit-tests.yml job.
      - name: Refresh Lockfile
        run: uv lock

      - name: Commit and Push
        env:
          HEAD_REF: ${{ github.head_ref }}
          NEXT_VERSION: ${{ steps.update_version.outputs.next_version }}
          BUMP_LABEL: ${{ github.event.label.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/nextdns_mcp/__init__.py Dockerfile Dockerfile.alpine uv.lock
          
          # Check if there are any staged changes before committing
          if git diff --cached --quiet; then
            echo "No changes to commit; skipping commit and push."
            exit 0
          fi
          
          git commit -m "chore: bump version to $NEXT_VERSION ($BUMP_LABEL)"
          git push origin "$HEAD_REF"
